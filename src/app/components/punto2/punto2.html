<div class="container">
  <div class="row gap-3" >

    <div class="col text-center card body g-3" *ngFor="let producto of productos">
      <h1 class="display-4">{{ producto.nombre }}</h1>
      <p class="lead">{{ producto.descripcion }}</p>
      <button (click)="agregarAlCarrito(producto)" class="btn btn-primary">Agregar al Carrito</button>
    </div>

  <button (click)="mostrar = !mostrar" class="btn btn-secondary mt-3">
    <!--{{ mostrar ? 'Ocultar Carrito' : 'Mostrar Carrito' }}-->
     mostrar
  </button>
  <div class="row gap-3 mt-5" [hidden]="!mostrar">
    <div class="col text-center card body g-3" *ngFor="let item of carrito">
      <h1 class="display-4">{{ item.nombre }}</h1>
      <p class="lead">{{ item.descripcion }}</p>
      <p class="lead">{{ item.precio }}</p>
    </div>
    <p>Total: {{ totalCarrito() }}</p>
     <button (click)="mostrar = !mostrar" class="btn btn-secondary mt-3">
    <!--{{ mostrar ? 'Ocultar Carrito' : 'Mostrar Carrito' }}-->
     checkout
  </button>
  </div>

  </div>


</div>
