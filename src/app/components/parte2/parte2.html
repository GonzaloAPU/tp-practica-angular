<div class="container mt-4">
  <div class="card p-4 mb-5">
    <h3>Formulario de Inscripción</h3>

    <div class="mb-3">
      <label>DNI</label>
      <input type="text" class="form-control" [(ngModel)]="nuevoAlumno.dni">
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="nuevoAlumno.email">
    </div>

    <div class="mb-3">
      <label>Curso</label>
      <input type="text" class="form-control" [(ngModel)]="nuevoAlumno.curso">
    </div>

    <div class="mb-3">
      <label>Fecha de ingreso</label>
      <input type="date" class="form-control" [(ngModel)]="nuevoAlumno.fechaIngreso">
    </div>

    <div class="mb-3">
      <label>Precio</label>
      <input type="number" class="form-control" [(ngModel)]="nuevoAlumno.precio">
    </div>

    <div class="mb-3">
      <label>Categoría Alumno</label>
      <select class="form-select" [(ngModel)]="nuevoAlumno.categoriaAlumno">
        <option [ngValue]="categoriaAlumno.Estudiante">Estudiante</option>
        <option [ngValue]="categoriaAlumno.Egresado">Egresado</option>
        <option [ngValue]="categoriaAlumno.Particular">Particular</option>
      </select>
    </div>

    <button class="btn btn-primary" (click)="agregar()">Agregar Alumno</button>
  </div>

  <div class="card p-4">
    <h3>Lista de Inscriptos</h3>
    
    <table datatable [dtOptions]="dtOptions" class="table table-striped table-bordered row-border hover">
      <thead>
        <tr>
          <th>DNI</th>
          <th>Email</th>
          <th>Curso</th>
          <th>Precio</th>
          <th>Categoría</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let alumno of inscripciones">
          <td>{{ alumno.dni }}</td>
          <td>{{ alumno.email }}</td>
          <td>{{ alumno.curso }}</td>
          <td>{{ alumno.precio }}</td>
          <td>{{ categoriaAlumno[alumno.categoriaAlumno] }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
